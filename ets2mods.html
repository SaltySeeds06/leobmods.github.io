<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Leob Mods - Euro Truck Simulator 2 mods, including ETS2 Global Background Maps, EAA Rescaled, and Caribbean.">
        <meta name="keywords" content="ETS2 Mods, Euro Truck Simulator 2, Global Background Map, EAA Rescaled, Project Caribbean, SaltySeeds06, saltyleob, leob, DanielV8">
        <link rel="icon" type="image/x-icon" href="images/salty.ico">
        <link rel="stylesheet" type="text/css" href="style.css">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8929085581911745"
     crossorigin="anonymous"></script>
        <title>ETS2 Mods</title>
    </head>
    <body>
        <nav>
            <ul>
                <li><img src="images/salty.png" id="web_logo" alt="Webpage logo" width="64" height="64"></li>
                <li><a href="./">Home</a></li>
                <li><a href="./ets2mods">ETS2 Mods</a></li>
                <li><a href="./contact">Contact</a></li>
            </ul>
        </nav>

        <div id="filter-bar">
            <input type="text" id="search-input" placeholder="Search mods...">
        </div>
 
        <div class="flexbox" id="mod-grid"></div>
 
        <script src="mods.js"></script>
        <script>
            const grid = document.getElementById("mod-grid");
            const filterBar = document.getElementById("filter-bar");
            const searchInput = document.getElementById("search-input");

            // Build category list from mods
            const categories = ["All", ...new Set(MODS.map(m => m.category))];

            // Track active category
            let activeCategory = "All";

            // Filter buttons
            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.textContent = cat;
                btn.className = "filter-btn" + (cat === "All" ? " filter-btn-active" : "");
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("filter-btn-active"));
                    btn.classList.add("filter-btn-active");
                    activeCategory = cat;
                    renderCards();
                });
                filterBar.appendChild(btn);
            });

            // Move search input to end of filter bar (after buttons are appended)
            filterBar.appendChild(searchInput);

            searchInput.addEventListener("input", renderCards);

            function renderCards() {
                const query = searchInput.value.trim().toLowerCase();
                let list = activeCategory === "All" ? MODS : MODS.filter(m => m.category === activeCategory);
                if (query) {
                    list = list.filter(m => m.title.toLowerCase().includes(query));
                }
                grid.innerHTML = "";
                list.forEach(mod => {
                    grid.innerHTML += `
                    <div class="box">
                        <a href="./mod?id=${encodeURIComponent(mod.id)}">
                            <div class="mod-card">
                                <img src="${mod.images ? mod.images[0] : mod.image}" alt="${mod.title}">
                                <h3 class="mod-title">${mod.title}</h3>
                            </div>
                        </a>
                    </div>`;
                });
            }

            renderCards();
        </script>

        <footer>
            <ul>
                <li>©2026 Leob Mods </li>
                <li><a href="./privacy">Privacy Policy</a></li>
            </ul>
        </footer>
    </body>
</html>
